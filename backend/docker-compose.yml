services:
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: tcongs-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-tcongsDevMasterKey2026}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data

volumes:
  meilisearch_data:
