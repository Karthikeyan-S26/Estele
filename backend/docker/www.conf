[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Trial-tier Railway containers are capped at ~1-2 vCPU / 1GB RAM (see
; tcongs-railway-deploy memory), so pm.max_children is sized conservatively —
; enough to actually run requests concurrently instead of queueing them
; behind a single worker, without over-committing memory. Tune upward once
; the real Railway plan's resources are known.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
