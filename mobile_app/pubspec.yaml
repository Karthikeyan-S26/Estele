name: estele
description: "Estele — a jewellery e-commerce mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_html: ^3.0.0
  razorpay_flutter: ^1.4.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  image_picker: ^1.1.2
  video_player: ^2.9.2

dependency_overrides:
  html: 0.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
    - assets/fonts/